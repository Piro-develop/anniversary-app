<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bd647b" />
    <meta name="description" content="大切な日と、次の節目をやさしく数える記念日管理アプリ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Anniversary" />
    <title>Anniversary</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" id="app">
      <section class="view is-active" id="home-view" aria-labelledby="home-heading">
        <header class="brand-header">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <p class="eyebrow">COUNT THE MOMENTS</p>
          <h1 class="brand-name">Anniversary</h1>
        </header>

        <div class="home-intro">
          <div>
            <p class="section-kicker">YOUR SPECIAL DAYS</p>
            <h2 id="home-heading">大切な日を、<br />数えよう。</h2>
          </div>
          <p class="count-badge" id="anniversary-count">0件</p>
        </div>

        <div class="anniversary-list" id="anniversary-list"></div>

        <div class="empty-state" id="empty-state" hidden>
          <div class="empty-orbit" aria-hidden="true"><span></span></div>
          <h3>まだ記念日がありません</h3>
          <p>大切な日を登録すると、<br />次の節目を自動でお知らせします。</p>
          <button class="primary-button" id="empty-add-button" type="button">
            <span aria-hidden="true">＋</span> 最初の記念日を追加
          </button>
        </div>

        <button class="primary-button sticky-action" id="add-button" type="button">
          <span aria-hidden="true">＋</span> 記念日を追加
        </button>
      </section>

      <section class="view" id="detail-view" aria-labelledby="detail-title" hidden>
        <header class="top-bar">
          <button class="icon-button" id="detail-back-button" type="button" aria-label="ホームへ戻る">←</button>
          <p>Anniversary</p>
          <button class="text-button" id="detail-edit-button" type="button">編集</button>
        </header>
        <div id="detail-content"></div>
      </section>

      <section class="view" id="form-view" aria-labelledby="form-title" hidden>
        <header class="top-bar">
          <button class="icon-button" id="form-back-button" type="button" aria-label="前の画面へ戻る">←</button>
          <h1 id="form-title">記念日を追加</h1>
          <span class="top-bar-spacer" aria-hidden="true"></span>
        </header>

        <form id="anniversary-form" novalidate>
          <div class="form-field">
            <label for="title-input">記念日の名前 <span class="required">必須</span></label>
            <input id="title-input" name="title" type="text" maxlength="32" autocomplete="off" placeholder="例：Our Anniversary" required />
            <p class="field-error" id="title-error"></p>
          </div>

          <div class="form-field">
            <label for="date-input">基準日 <span class="required">必須</span></label>
            <input id="date-input" name="baseDate" type="date" required />
            <p class="field-hint">この日を「1日目」として数えます。</p>
            <p class="field-error" id="date-error"></p>
          </div>

          <div class="form-field">
            <div class="label-row">
              <label for="memo-input">メモ <span class="optional">任意</span></label>
              <span id="memo-count">0 / 120</span>
            </div>
            <textarea id="memo-input" name="memo" maxlength="120" rows="4" placeholder="大切な日の思い出など"></textarea>
            <p class="field-error" id="memo-error"></p>
          </div>

          <details class="custom-milestone-panel">
            <summary>
              <span><span class="summary-plus" aria-hidden="true">＋</span> 自分だけの節目</span>
              <span class="chevron" aria-hidden="true">⌄</span>
            </summary>
            <div class="form-field compact-field">
              <label for="milestones-input">日数をカンマ区切りで入力</label>
              <input id="milestones-input" name="customMilestones" type="text" inputmode="numeric" placeholder="例：365, 777, 1111" />
              <p class="field-hint">1〜100,000の整数を入力できます。</p>
              <p class="field-error" id="milestones-error"></p>
            </div>
          </details>

          <button class="primary-button form-submit" id="save-button" type="submit">保存する</button>
          <button class="danger-button" id="delete-button" type="button" hidden>この記念日を削除</button>
        </form>
      </section>
    </main>

    <div class="modal-backdrop" id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title" hidden>
      <div class="modal-card">
        <p class="section-kicker">DELETE ANNIVERSARY</p>
        <h2 id="delete-modal-title">この記念日を削除しますか？</h2>
        <p id="delete-modal-message"></p>
        <p class="modal-warning">この操作は元に戻せません。</p>
        <div class="modal-actions">
          <button class="secondary-button" id="delete-cancel-button" type="button">キャンセル</button>
          <button class="danger-solid-button" id="delete-confirm-button" type="button">削除する</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js" defer></script>
  </body>
</html>
